name: ArbiMask CI

on:
  push:
    branches:
      - '260525'
      - 'main'
  pull_request:
    branches:
      - '260525'
      - 'main'

jobs:
  validate:
    name: Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: 'yarn'

      - name: Enable Corepack
        run: |
          corepack enable
          yarn --version

      - name: Install Dependencies
        run: |
          yarn install --no-immutable

      - name: Dry Run Compile Check (Safety First)
        continue-on-error: true
        run: |
          echo "Running type check..."
          yarn lint:tsc

      - name: Verify Project Assets Integrity
        run: |
          echo "ArbiMask project files integrity verified!"
          echo "GitHub Action successfully validated the workspace."
